services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: forecastops
      POSTGRES_PASSWORD: forecastops
      POSTGRES_DB: forecastops
    ports:
      - "5438:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forecastops"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    ports:
      - "8008:8008"
    environment:
      DATABASE_URL: postgresql+psycopg://forecastops:forecastops@db:5432/forecastops
      JWT_SECRET: dev-secret-change-in-production
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python seed.py && uvicorn app.main:app --host 0.0.0.0 --port 8008"

  frontend:
    build: ./frontend
    ports:
      - "3008:80"
    depends_on:
      - api

volumes:
  pgdata:
